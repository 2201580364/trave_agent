name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest + golden + layering)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.8.15

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: |
          uv run --no-sync ruff check src/ scripts/ tests/
          uv run --no-sync ruff format --check src/travel_agent/ scripts/ tests/ || echo "format drift exists (non-blocking for now)"

      - name: Pytest
        run: uv run --no-sync pytest

      - name: Golden cases (Gate 6)
        run: uv run --no-sync python scripts/run_golden_cases.py --output var/ci/golden-report.json

      - name: Layering assertions
        run: uv run --no-sync python scripts/check_layering.py

      - name: OpenAPI contract diff (S8-2)
        run: |
          uv run --no-sync python scripts/export_openapi_schema.py --output var/ci/openapi-schema.json
          uv run --no-sync python scripts/check_api_contract.py --schema var/ci/openapi-schema.json

      - name: Docs gate
        run: uv run --no-sync python scripts/check_docs.py

      - name: Share locked OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: var/ci/openapi-schema.json
          if-no-files-found: error

  admin-web:
    needs: backend
    name: admin-web (vitest + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Download locked OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: var/reports

      - name: Check generated API types
        run: |
          npm run generate-api-types
          git diff --exit-code -- src/api/api-schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    # Keep the existing check name for branch-protection compatibility.
    name: frontend (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
