[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "Deterministic itinerary solver for the travel assistant P1 MVP"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.111,<1",
    "ortools>=9.10,<10",
    "pymysql>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
travel-agent-archive-logs = "travel_agent.observability.archive:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
