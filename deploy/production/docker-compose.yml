name: travel-agent

x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: "10"}

services:
  api:
    image: &api-image ccr.ccs.tencentyun.com/travel_agent/travel_agent@sha256:ffc72164d06621a9cbad60a39361fa81621dfd7bf843a38632df8e703cdc56da
    restart: unless-stopped
    expose: ["8000"]
    environment:
      TRAVEL_AGENT_CONFIG_FILE: /etc/travel-agent/api/.env
    volumes:
      - /etc/travel-agent/api/.env:/etc/travel-agent/api/.env:ro
      - /srv/travel-agent/logs/api:/app/logs
      - /srv/travel-agent/data/api:/app/var
      - /srv/travel-agent/data/published:/srv/travel-agent/data/published:ro
    logging: *logging
    networks: [backend, frontend]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  generation-worker:
    image: *api-image
    restart: unless-stopped
    command: ["python", "-m", "travel_agent.interfaces.generation_worker", "--log-root", "/app/logs"]
    environment:
      TRAVEL_AGENT_CONFIG_FILE: /etc/travel-agent/generation-worker/.env
    volumes:
      - /etc/travel-agent/api/.env:/etc/travel-agent/generation-worker/.env:ro
      - /srv/travel-agent/logs/generation-worker:/app/logs
      - /srv/travel-agent/data/generation-worker:/app/var
      - /srv/travel-agent/data/published:/srv/travel-agent/data/published:ro
    logging: *logging
    networks: [backend]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  migrate:
    image: *api-image
    command: ["sh", "-c", "exec python -m alembic upgrade head >> /app/logs/migrate.log 2>&1"]
    profiles: [tools]
    environment:
      TRAVEL_AGENT_CONFIG_FILE: /etc/travel-agent/migrate/.env
    volumes:
      - /etc/travel-agent/migrate/.env:/etc/travel-agent/migrate/.env:ro
      - /srv/travel-agent/logs/migrate:/app/logs
    logging: *logging
    networks: [backend]
    depends_on:
      mysql: {condition: service_healthy}
  user-h5:
    image: ccr.ccs.tencentyun.com/travel_agent/travel_agent@sha256:1b84d1d327ea1850882e1d2903c8e893dc8f6345f30eccf40baa8d8c978c4766
    restart: unless-stopped
    volumes:
      - /etc/travel-agent/user-h5:/etc/caddy:ro
      - /srv/travel-agent/logs/user-h5:/var/log/caddy
      - /srv/travel-agent/data/user-h5:/data
    logging: *logging
    networks: [frontend]
  admin-web:
    image: ccr.ccs.tencentyun.com/travel_agent/travel_agent@sha256:5d05bf10cd318f049ac759d976336d552de30b9e36424bef121b35bdd2c236d6
    restart: unless-stopped
    volumes:
      - /etc/travel-agent/admin-web:/etc/caddy:ro
      - /srv/travel-agent/logs/admin-web:/var/log/caddy
      - /srv/travel-agent/data/admin-web:/data
    logging: *logging
    networks: [frontend]
  edge:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports: ["0.0.0.0:18080:80"]
    volumes:
      - /etc/travel-agent/edge:/etc/caddy:ro
      - /srv/travel-agent/logs/edge:/var/log/caddy
      - /srv/travel-agent/data/edge:/data
    logging: *logging
    networks: [frontend]
    depends_on: [api, user-h5, admin-web]
  mysql:
    image: mysql:8.0
    container_name: travel-agent-mysql
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /etc/travel-agent/mysql/root-password
      MYSQL_DATABASE: travel_agent
    ports: ["0.0.0.0:23306:3306"]
    volumes:
      - /srv/travel-agent/data/mysql:/var/lib/mysql
      - /etc/travel-agent/mysql/conf.d:/etc/mysql/conf.d:ro
      - /etc/travel-agent/mysql/clients:/etc/travel-agent/mysql/clients:ro
      - /etc/travel-agent/mysql/root-password:/etc/travel-agent/mysql/root-password:ro
      - /etc/travel-agent/mysql/health.cnf:/etc/travel-agent/mysql/health.cnf:ro
      - /srv/travel-agent/logs/mysql:/var/log/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysql --defaults-extra-file=/etc/travel-agent/mysql/health.cnf --protocol=socket --batch --skip-column-names -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    container_name: travel-agent-redis
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.25
    pids_limit: 128
    stop_grace_period: 30s
    user: "999:999"
    command: [redis-server, /etc/redis/redis.conf]
    ports: ["0.0.0.0:26379:6379"]
    volumes:
      - /srv/travel-agent/data/redis:/data
      - /etc/travel-agent/redis:/etc/redis:ro
      - /srv/travel-agent/logs/redis:/var/log/redis
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /etc/redis/health-password)" redis-cli --user "$$(cat /etc/redis/health-user)" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [backend]

networks:
  frontend:
    name: travel-agent-frontend
    driver: bridge
  backend:
    name: travel-agent-backend
    external: true
